:root {
  --bg:#0f0f0f;
  --card:#181818;
  --card-border:rgba(255,255,255,0.08);
  --text:#eee;
  --muted:#8e8e93;
  --accent:#e57e8d;
  --accent-soft:#efb1ba;
}

* { box-sizing:border-box; }

body {
  margin:0;
  padding:24px 0 40px;
  background:var(--bg);
  color:var(--text);
  font-family:'Assistant',sans-serif;
  display:flex;
  justify-content:center;
}

.wrapper {
  width:100%;
  max-width:420px;
  padding:0 12px;
}

h1 {
  margin:0 0 14px;
  font-size:18px;
  font-weight:700;
  letter-spacing:0.2px;
  text-align:center;
}

/* ---------- Settings card ---------- */
.card.below { margin:0; }

.note {
  display:block;
  margin:14px 0 0;
  overflow:hidden;
  text-decoration:none;
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:12px;
  transition:border-color .15s;
}

.note:hover { border-color:rgba(229,126,141,0.5); }

.note img {
  display:block;
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
}

.note-text {
  display:block;
  padding:10px 14px;
  font-size:13.5px;
  font-weight:600;
  text-align:center;
  color:var(--accent-soft);
}

.card {
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
}

.field-label {
  display:block;
  font-size:12px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.6px;
  color:var(--muted);
  margin-bottom:6px;
}

input[type="text"] {
  width:100%;
  padding:10px 12px;
  font-family:inherit;
  font-size:15px;
  color:var(--text);
  background:#101010;
  border:1px solid #2c2c2c;
  border-radius:8px;
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}

input[type="text"]:focus {
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(229,126,141,0.18);
}

.divider {
  height:1px;
  background:var(--card-border);
  margin:14px 0;
}

/* Toggle row */
.toggle-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.toggle-text {
  font-size:14px;
  font-weight:600;
}

.toggle-hint {
  display:block;
  margin-top:2px;
  font-size:12px;
  font-weight:400;
  color:var(--muted);
}

.switch {
  position:relative;
  flex-shrink:0;
  width:42px;
  height:24px;
}

.switch input {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  margin:0;
  opacity:0;
  cursor:pointer;
  z-index:1;
}

.switch .track {
  position:absolute;
  inset:0;
  background:#3a3a3a;
  border-radius:999px;
  transition:background .2s;
}

.switch .track::after {
  content:"";
  position:absolute;
  top:3px;
  left:3px;
  width:18px;
  height:18px;
  background:#fff;
  border-radius:50%;
  transition:transform .2s;
}

.switch input:checked + .track { background:var(--accent); }
.switch input:checked + .track::after { transform:translateX(18px); }

/* Sliders */
.slider-row {
  display:grid;
  grid-template-columns:84px 1fr 44px;
  align-items:center;
  gap:10px;
  font-size:13px;
}

.slider-row + .slider-row { margin-top:10px; }

.slider-row .name { color:#ccc; font-weight:600; }
.slider-row .val  { text-align:right; color:var(--muted); font-size:12.5px; }

input[type="range"] {
  -webkit-appearance:none;
  appearance:none;
  width:100%;
  height:4px;
  margin:0;
  background:#333;
  border-radius:999px;
  outline:none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance:none;
  appearance:none;
  width:16px;
  height:16px;
  background:var(--accent);
  border:2px solid #fff;
  border-radius:50%;
  cursor:pointer;
}

input[type="range"]::-moz-range-thumb {
  width:12px;
  height:12px;
  background:var(--accent);
  border:2px solid #fff;
  border-radius:50%;
  cursor:pointer;
}

.reset-btn {
  display:block;
  margin:12px 0 0 auto;
  padding:5px 12px;
  font-family:inherit;
  font-size:12px;
  font-weight:600;
  color:var(--accent-soft);
  background:transparent;
  border:1px solid rgba(229,126,141,0.4);
  border-radius:999px;
  cursor:pointer;
  transition:background .15s;
}

.reset-btn:hover { background:rgba(229,126,141,0.12); }

/* ---------- Player ---------- */
.player-wrap {
  --sub-top:56%;
  --text-scale:1;
  --box-scale:1;
  --mc-x:0;     /* horizontal shift of the MC text box, in % of the video width */
  --other-x:0;  /* horizontal shift of other speakers' text boxes */
  --name-x:0;   /* horizontal shift of the name box, in % of the video width */
  position:relative;
  width:100%;
  aspect-ratio:9/16;
  background:black;
  overflow:hidden;
  border-radius:12px;
  border:1px solid var(--card-border);
}

iframe {
  width:100%;
  height:100%;
  border:none;
}

/* ---------- Subtitle overlay ---------- */
#subs {
  position:absolute;
  top:var(--sub-top);
  left:calc(50% + var(--other-x) * 1%);
  transform:translateX(calc(-50% - 8px));
  width:calc((76% + 10px) * var(--box-scale));

  padding:calc(10px * var(--box-scale)) calc(14px * var(--box-scale));
  background: rgba(99, 89, 103, 0.55);
  border-radius:14px;

  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);

  font-family:'Source Han Sans SC','Assistant',sans-serif;
  letter-spacing:0.5px;
  font-size:calc(13.5px * var(--text-scale));
  line-height:1.45;
  color:#f2f2f2;

  text-shadow:0 1px 2px rgba(0,0,0,0.6);
  box-sizing:border-box;
  min-height:3.2em;

  user-select:none;
  pointer-events:none;
}

#subs.mc {
  left:calc(50% + var(--mc-x) * 1%);
  transform:translateX(calc(-50% + 30px));
  width:calc((76% - 30px) * var(--box-scale));
}

#subs.spoken {
  background: rgba(255,255,255,0.55);
  color: #444;
  text-shadow: none;
}

#subs.hidden { display:none; }

/* Text not typed yet: invisible but still takes space, so the box doesn't resize while typing */
#subs .rest { visibility:hidden; }

#mc-name-box {
  position:absolute;
  top:calc(var(--sub-top) - 0.8%);
  left:calc(50% + var(--name-x) * 1%);
  transform: translateX(calc(-50% - 44px)) translateY(calc(-82% - 1px));

  padding:calc(4px * var(--box-scale)) calc(12px * var(--box-scale));
  min-width:calc(54px * var(--box-scale));
  text-align:center;

  font-family:'Source Han Sans SC','Assistant',sans-serif;
  letter-spacing:0.5px;
  font-size:calc(13px * var(--text-scale));
  font-weight:600;
  color:#fff;

  background: linear-gradient(90deg, #e57e8d 0%, #e98f9c 55%, #efb1ba 100%);
  border-radius:12px;
  box-shadow:
    0 2px 6px rgba(0,0,0,0.18),
    0 0 8px rgba(229,126,141,0.45);

  white-space:nowrap;
  user-select:none;
  pointer-events:none;
}

#mc-name-box.hidden { display:none; }
</style>
</head>

      onReady: () => {
        fetch('subs.srt')
          .then(r => r.text())
          .then(parseSRT)
          .then(d => subtitles = d);
      }
    }
  });

  setInterval(updateSubs, 40);
}

function parseSRT(data) {
  return data.replace(/\r/g,'')
    .trim()
    .split(/\n\n+/)
    .map(b=>{
      const l=b.split('\n');
      if(l.length<2) return null;
      const [s,e]=l[1].split(' --> ').map(toSec);
      return {start:s,end:e,text:l.slice(2).join(' ')};
    })
    .filter(Boolean);
}

function toSec(t){
  const [h,m,s]=t.replace(',','.').split(':');
  return h*3600+m*60+parseFloat(s);
}

function updateSubs(){
  const box = document.getElementById('subs');
  const nameBox = document.getElementById('mc-name-box');

  if(!ytPlayer?.getCurrentTime || !subsEnabled){
    box.classList.add('hidden');
    nameBox.classList.add('hidden');
    return;
  }

  const t = ytPlayer.getCurrentTime();
  const mcName = document.getElementById('mcName').value.trim() || 'MC';

  const line = subtitles.find(s => t >= s.start && t <= s.end);
  if(!line){
    box.classList.add('hidden');
    nameBox.classList.add('hidden');
    return;
  }

  let rawText = line.text;

  const hasSpeaker = /^[A-Za-z\u4e00-\u9fa5][A-Za-z\u4e00-\u9fa5 .]{0,15}[:：]\s/.test(rawText);
  const isMC = rawText.startsWith('MC:') || rawText.startsWith('MC：');

  let dialogue = rawText.replace(/^[^:：]+[:：]\s*/, '');
  dialogue = dialogue.replace(/\bMC\b(?=[^\w]|$)/g, mcName);

  // Typing animation: reveal letters based on the video time, so pausing and seeking just work
  const chars = Array.from(dialogue);
  let count = chars.length;

  if(typeEnabled && chars.length){
    const lineLen = Math.max(0.2, line.end - line.start);
    const typeTime = Math.min(chars.length / TYPE_SPEED, lineLen * TYPE_MAX_SHARE);
    const cps = chars.length / Math.max(0.1, typeTime);
    count = Math.min(chars.length, Math.floor((t - line.start) * cps) + 1);
  }

  const key = dialogue + '|' + count;
  if(key !== lastKey){
    lastKey = key;
    box.textContent = '';
    const shown = document.createElement('span');
    shown.textContent = chars.slice(0, count).join('');
    const rest = document.createElement('span');
    rest.className = 'rest';
    rest.textContent = chars.slice(count).join('');
    box.append(shown, rest);
  }

  box.classList.toggle('mc', isMC);
  box.classList.toggle('spoken', hasSpeaker);
  box.classList.remove('hidden');

  if(isMC){
    nameBox.textContent = mcName;
    nameBox.classList.remove('hidden');
  } else {
    nameBox.classList.add('hidden');
  }
}

const playerWrap = document.getElementById('playerWrap');
const heightSlider = document.getElementById('subHeight');
const textSlider = document.getElementById('textSize');
const boxSlider = document.getElementById('boxSize');
const mcXSlider = document.getElementById('mcX');
const otherXSlider = document.getElementById('otherX');
const nameXSlider = document.getElementById('nameX');

function applySubLayout(){
  const h = parseFloat(heightSlider.value);
  const t = parseFloat(textSlider.value);
  const b = parseFloat(boxSlider.value);
  const mx = parseFloat(mcXSlider.value);
  const ox = parseFloat(otherXSlider.value);
  const nx = parseFloat(nameXSlider.value);
  // higher slider value = higher on screen
  playerWrap.style.setProperty('--sub-top', (100 - h) + '%');
  playerWrap.style.setProperty('--text-scale', t);
  playerWrap.style.setProperty('--box-scale', b);
  // X sliders: negative = left, positive = right
  playerWrap.style.setProperty('--mc-x', mx);
  playerWrap.style.setProperty('--other-x', ox);
  playerWrap.style.setProperty('--name-x', nx);
  document.getElementById('subHeightVal').textContent = Math.round(h);
  document.getElementById('textSizeVal').textContent = Math.round(t * 100) + '%';
  document.getElementById('boxSizeVal').textContent = Math.round(b * 100) + '%';
  document.getElementById('mcXVal').textContent = Math.round(mx);
  document.getElementById('otherXVal').textContent = Math.round(ox);
  document.getElementById('nameXVal').textContent = Math.round(nx);
}

heightSlider.addEventListener('input', applySubLayout);
textSlider.addEventListener('input', applySubLayout);
boxSlider.addEventListener('input', applySubLayout);
mcXSlider.addEventListener('input', applySubLayout);
otherXSlider.addEventListener('input', applySubLayout);
nameXSlider.addEventListener('input', applySubLayout);

document.getElementById('resetSub').addEventListener('click', () => {
  heightSlider.value = 44;
  textSlider.value = 1;
  boxSlider.value = 1;
  mcXSlider.value = 0;
  otherXSlider.value = 0;
  nameXSlider.value = 0;
  applySubLayout();
});

applySubLayout();

document.getElementById('toggleType').addEventListener('change', e => {
  typeEnabled = e.target.checked;
});

document.getElementById('toggleCC').addEventListener('change', e => {
  subsEnabled = e.target.checked;
  if(!subsEnabled){
    document.getElementById('subs').classList.add('hidden');
    document.getElementById('mc-name-box').classList.add('hidden');
  }
});
</script>
</body>
</html>
