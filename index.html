<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Invitation Date Interactive Video</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0f0f0f;
  --card:#181818;
  --card-border:rgba(255,255,255,0.08);
  --text:#eee;
  --muted:#8e8e93;
  --accent:#e57e8d;
  --accent-soft:#efb1ba;
}

* { box-sizing:border-box; }

body {
  margin:0;
  padding:24px 0 40px;
  background:var(--bg);
  color:var(--text);
  font-family:'Assistant',sans-serif;
  display:flex;
  justify-content:center;
}

.wrapper {
  width:100%;
  max-width:420px;
  padding:0 12px;
}

h1 {
  margin:0 0 14px;
  font-size:18px;
  font-weight:700;
  letter-spacing:0.2px;
  text-align:center;
}

/* ---------- Settings card ---------- */
.card {
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
}

.field-label {
  display:block;
  font-size:12px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.6px;
  color:var(--muted);
  margin-bottom:6px;
}

input[type="text"] {
  width:100%;
  padding:10px 12px;
  font-family:inherit;
  font-size:15px;
  color:var(--text);
  background:#101010;
  border:1px solid #2c2c2c;
  border-radius:8px;
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}

input[type="text"]:focus {
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(229,126,141,0.18);
}

.divider {
  height:1px;
  background:var(--card-border);
  margin:14px 0;
}

/* Toggle row */
.toggle-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.toggle-text {
  font-size:14px;
  font-weight:600;
}

.toggle-hint {
  display:block;
  margin-top:2px;
  font-size:12px;
  font-weight:400;
  color:var(--muted);
}

.switch {
  position:relative;
  flex-shrink:0;
  width:42px;
  height:24px;
}

.switch input {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  margin:0;
  opacity:0;
  cursor:pointer;
  z-index:1;
}

.switch .track {
  position:absolute;
  inset:0;
  background:#3a3a3a;
  border-radius:999px;
  transition:background .2s;
}

.switch .track::after {
  content:"";
  position:absolute;
  top:3px;
  left:3px;
  width:18px;
  height:18px;
  background:#fff;
  border-radius:50%;
  transition:transform .2s;
}

.switch input:checked + .track { background:var(--accent); }
.switch input:checked + .track::after { transform:translateX(18px); }

/* Sliders */
.slider-row {
  display:grid;
  grid-template-columns:68px 1fr 44px;
  align-items:center;
  gap:10px;
  font-size:13px;
}

.slider-row + .slider-row { margin-top:10px; }

.slider-row .name { color:#ccc; font-weight:600; }
.slider-row .val  { text-align:right; color:var(--muted); font-size:12.5px; }

input[type="range"] {
  -webkit-appearance:none;
  appearance:none;
  width:100%;
  height:4px;
  margin:0;
  background:#333;
  border-radius:999px;
  outline:none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance:none;
  appearance:none;
  width:16px;
  height:16px;
  background:var(--accent);
  border:2px solid #fff;
  border-radius:50%;
  cursor:pointer;
}

input[type="range"]::-moz-range-thumb {
  width:12px;
  height:12px;
  background:var(--accent);
  border:2px solid #fff;
  border-radius:50%;
  cursor:pointer;
}

.reset-btn {
  display:block;
  margin:12px 0 0 auto;
  padding:5px 12px;
  font-family:inherit;
  font-size:12px;
  font-weight:600;
  color:var(--accent-soft);
  background:transparent;
  border:1px solid rgba(229,126,141,0.4);
  border-radius:999px;
  cursor:pointer;
  transition:background .15s;
}

.reset-btn:hover { background:rgba(229,126,141,0.12); }

/* ---------- Player ---------- */
.player-wrap {
  --sub-top:56%;
  --text-scale:1;
  --box-scale:1;
  position:relative;
  width:100%;
  aspect-ratio:9/16;
  background:black;
  overflow:hidden;
  border-radius:12px;
  border:1px solid var(--card-border);
}

iframe {
  width:100%;
  height:100%;
  border:none;
}

/* ---------- Subtitle overlay ---------- */
#subs {
  position:absolute;
  top:var(--sub-top);
  left:50%;
  transform:translateX(calc(-50% - 8px));
  width:calc((76% + 10px) * var(--box-scale));

  padding:calc(10px * var(--box-scale)) calc(14px * var(--box-scale));
  background: rgba(99, 89, 103, 0.55);
  border-radius:14px;

  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);

  font-size:calc(13.5px * var(--text-scale));
  line-height:1.45;
  color:#f2f2f2;

  text-shadow:0 1px 2px rgba(0,0,0,0.6);
  box-sizing:border-box;
  min-height:3.2em;

  user-select:none;
  pointer-events:none;
}

#subs.mc {
  transform:translateX(calc(-50% + 30px));
  width:calc((76% - 30px) * var(--box-scale));
}

#subs.spoken {
  background: rgba(255,255,255,0.55);
  color: #444;
  text-shadow: none;
}

#subs.hidden { display:none; }

/* Text not typed yet: invisible but still takes space, so the box doesn't resize while typing */
#subs .rest { visibility:hidden; }

#mc-name-box {
  position:absolute;
  top:calc(var(--sub-top) - 0.8%);
  left:50%;
  transform: translateX(calc(-50% - 44px)) translateY(calc(-82% - 1px));

  padding:calc(4px * var(--box-scale)) calc(12px * var(--box-scale));
  min-width:calc(54px * var(--box-scale));
  text-align:center;

  font-size:calc(13px * var(--text-scale));
  font-weight:600;
  color:#fff;

  background: linear-gradient(90deg, #e57e8d 0%, #e98f9c 55%, #efb1ba 100%);
  border-radius:12px;
  box-shadow:
    0 2px 6px rgba(0,0,0,0.18),
    0 0 8px rgba(229,126,141,0.45);

  white-space:nowrap;
  user-select:none;
  pointer-events:none;
}

#mc-name-box.hidden { display:none; }
</style>
</head>

<body>
<div class="wrapper">

  <h1>Invitation Date</h1>

  <div class="card">
    <label class="field-label" for="mcName">Your name</label>
    <input id="mcName" type="text" value="MC" placeholder="Type your name here" autocomplete="off">

    <div class="divider"></div>

    <div class="toggle-row">
      <div class="toggle-text">
        Show subtitles
        <span class="toggle-hint">Subtitles don't show in fullscreen</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleCC" checked>
        <span class="track"></span>
      </label>
    </div>

    <div class="divider"></div>

    <div class="toggle-row">
      <div class="toggle-text">
        Typing animation
        <span class="toggle-hint">Text appears letter by letter</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleType" checked>
        <span class="track"></span>
      </label>
    </div>

    <div class="divider"></div>

    <div class="slider-row">
      <span class="name">Height</span>
      <input type="range" id="subHeight" min="5" max="90" step="1" value="44">
      <span class="val" id="subHeightVal">44</span>
    </div>
    <div class="slider-row">
      <span class="name">Text size</span>
      <input type="range" id="textSize" min="0.6" max="2" step="0.05" value="1">
      <span class="val" id="textSizeVal">100%</span>
    </div>
    <div class="slider-row">
      <span class="name">Box size</span>
      <input type="range" id="boxSize" min="0.6" max="1.3" step="0.05" value="1">
      <span class="val" id="boxSizeVal">100%</span>
    </div>

    <button type="button" class="reset-btn" id="resetSub">Reset</button>
  </div>

  <div class="player-wrap" id="playerWrap">
    <iframe
      id="yt-frame"
      src="https://www.youtube.com/embed/EMrPkNvl-JI?si=OzljqG5NAMdIeMXR&enablejsapi=1&playsinline=1"
      allow="encrypted-media; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>

    <div id="mc-name-box" class="hidden"></div>
    <div id="subs" class="hidden"></div>
  </div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let ytPlayer;
let subtitles = [];
let subsEnabled = true;
let typeEnabled = true;
let lastKey = '';

const TYPE_SPEED = 30;      // letters per second
const TYPE_MAX_SHARE = 0.75; // finish typing within this share of the line's time

function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('yt-frame', {
    events: {
      onReady: () => {
        fetch('subs.srt')
          .then(r => r.text())
          .then(parseSRT)
          .then(d => subtitles = d);
      }
    }
  });

  setInterval(updateSubs, 40);
}

function parseSRT(data) {
  return data.replace(/\r/g,'')
    .trim()
    .split(/\n\n+/)
    .map(b=>{
      const l=b.split('\n');
      if(l.length<2) return null;
      const [s,e]=l[1].split(' --> ').map(toSec);
      return {start:s,end:e,text:l.slice(2).join(' ')};
    })
    .filter(Boolean);
}

function toSec(t){
  const [h,m,s]=t.replace(',','.').split(':');
  return h*3600+m*60+parseFloat(s);
}

function updateSubs(){
  const box = document.getElementById('subs');
  const nameBox = document.getElementById('mc-name-box');

  if(!ytPlayer?.getCurrentTime || !subsEnabled){
    box.classList.add('hidden');
    nameBox.classList.add('hidden');
    return;
  }

  const t = ytPlayer.getCurrentTime();
  const mcName = document.getElementById('mcName').value.trim() || 'MC';

  const line = subtitles.find(s => t >= s.start && t <= s.end);
  if(!line){
    box.classList.add('hidden');
    nameBox.classList.add('hidden');
    return;
  }

  let rawText = line.text;

  const hasSpeaker = /^[A-Za-z\u4e00-\u9fa5][A-Za-z\u4e00-\u9fa5 .]{0,15}[:：]\s/.test(rawText);
  const isMC = rawText.startsWith('MC:') || rawText.startsWith('MC：');

  let dialogue = rawText.replace(/^[^:：]+[:：]\s*/, '');
  dialogue = dialogue.replace(/\bMC\b(?=[^\w]|$)/g, mcName);

  // Typing animation: reveal letters based on the video time, so pausing and seeking just work
  const chars = Array.from(dialogue);
  let count = chars.length;

  if(typeEnabled && chars.length){
    const lineLen = Math.max(0.2, line.end - line.start);
    const typeTime = Math.min(chars.length / TYPE_SPEED, lineLen * TYPE_MAX_SHARE);
    const cps = chars.length / Math.max(0.1, typeTime);
    count = Math.min(chars.length, Math.floor((t - line.start) * cps) + 1);
  }

  const key = dialogue + '|' + count;
  if(key !== lastKey){
    lastKey = key;
    box.textContent = '';
    const shown = document.createElement('span');
    shown.textContent = chars.slice(0, count).join('');
    const rest = document.createElement('span');
    rest.className = 'rest';
    rest.textContent = chars.slice(count).join('');
    box.append(shown, rest);
  }

  box.classList.toggle('mc', isMC);
  box.classList.toggle('spoken', hasSpeaker);
  box.classList.remove('hidden');

  if(isMC){
    nameBox.textContent = mcName;
    nameBox.classList.remove('hidden');
  } else {
    nameBox.classList.add('hidden');
  }
}

const playerWrap = document.getElementById('playerWrap');
const heightSlider = document.getElementById('subHeight');
const textSlider = document.getElementById('textSize');
const boxSlider = document.getElementById('boxSize');

function applySubLayout(){
  const h = parseFloat(heightSlider.value);
  const t = parseFloat(textSlider.value);
  const b = parseFloat(boxSlider.value);
  // higher slider value = higher on screen
  playerWrap.style.setProperty('--sub-top', (100 - h) + '%');
  playerWrap.style.setProperty('--text-scale', t);
  playerWrap.style.setProperty('--box-scale', b);
  document.getElementById('subHeightVal').textContent = Math.round(h);
  document.getElementById('textSizeVal').textContent = Math.round(t * 100) + '%';
  document.getElementById('boxSizeVal').textContent = Math.round(b * 100) + '%';
}

heightSlider.addEventListener('input', applySubLayout);
textSlider.addEventListener('input', applySubLayout);
boxSlider.addEventListener('input', applySubLayout);

document.getElementById('resetSub').addEventListener('click', () => {
  heightSlider.value = 44;
  textSlider.value = 1;
  boxSlider.value = 1;
  applySubLayout();
});

applySubLayout();

document.getElementById('toggleType').addEventListener('change', e => {
  typeEnabled = e.target.checked;
});

document.getElementById('toggleCC').addEventListener('change', e => {
  subsEnabled = e.target.checked;
  if(!subsEnabled){
    document.getElementById('subs').classList.add('hidden');
    document.getElementById('mc-name-box').classList.add('hidden');
  }
});
</script>
</body>
</html>
